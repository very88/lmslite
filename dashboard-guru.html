<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 100%);
            color: #334155;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Glass panel versi Light Mode */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        /* Input Styling modern */
        .modern-input {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            transition: all 0.2s ease-in-out;
        }
        .modern-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .modern-input-amber:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Navbar -->
    <nav class="glass-panel rounded-2xl p-4 mb-8 flex justify-between items-center">
        <div class="text-xl font-bold text-sky-600">LMS Workspace</div>
        <div class="flex items-center gap-4">
            <div class="text-sm font-medium text-slate-500">Halo, <span id="namaGuru" class="font-bold text-slate-800">Guru</span></div>
            <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all">Keluar</button>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Panel Kiri: Form Buat Kelas -->
        <div class="glass-panel rounded-2xl p-6 md:col-span-1 h-fit">
            <h2 class="text-xl font-bold mb-4 text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2">Buat Kelas Baru</h2>
            <form id="formBuatKelas" onsubmit="buatKelas(event)">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Kelas / Mata Pelajaran</label>
                    <input type="text" id="nama_kelas" required class="w-full rounded-lg px-4 py-2 modern-input" placeholder="Contoh: PJOK Kelas X-A">
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-300 shadow-md">Buat Kelas</button>
            </form>

            <div id="hasilBuatKelas" class="mt-6 hidden bg-emerald-50 border border-emerald-200 rounded-lg p-4 text-center">
                <p class="text-sm font-semibold text-emerald-700 mb-1">Kelas berhasil dibuat!</p>
                <div class="text-2xl font-mono font-bold text-slate-800 tracking-widest bg-white py-2 rounded border border-slate-200" id="kodeKelasBaru"></div>
            </div>
        </div>

        <!-- Panel Kanan: Daftar Kelas -->
        <div class="glass-panel rounded-2xl p-6 md:col-span-2">
            <h2 class="text-xl font-bold mb-4 text-slate-800 border-b border-slate-200 pb-2">Kelas Anda</h2>
            
            <!-- Area ini akan diisi secara dinamis oleh JavaScript -->
            <div id="daftarKelasContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                <div class="text-slate-500 col-span-2 text-center py-8 font-medium">Memuat kelas...</div>
            </div>
        </div>
    </div>

    <!-- Modal Edit Kelas -->
    <div id="modalEditKelas" class="fixed inset-0 z-50 hidden bg-slate-800/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md border border-slate-200 shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-slate-800 border-b border-slate-100 pb-2">Edit Nama Kelas</h2>
            <form onsubmit="simpanEditKelas(event)">
                <input type="hidden" id="edit_class_id">
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Kelas / Mata Pelajaran Baru</label>
                    <input type="text" id="edit_nama_kelas" required class="w-full rounded-lg px-4 py-2 modern-input-amber">
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="document.getElementById('modalEditKelas').classList.add('hidden')" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2 rounded-lg transition-colors">Batal</button>
                    <button type="submit" id="btnSimpanEditKelas" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-white font-semibold py-2 rounded-lg transition-colors">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyTICgF-NqTCpCw3A38R_wgxJ9AZZiXB9Y1yYaGG81LtyaRRUG95qBimEZ_5snTYoxj/exec';
        let currentUser = null;

        window.onload = function() {
            const sessionData = localStorage.getItem('lms_user');
            if (!sessionData) {
                window.location.href = 'index.html';
                return;
            }
            
            currentUser = JSON.parse(sessionData);
            if (currentUser.role !== 'Guru') {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('namaGuru').innerText = currentUser.nama_lengkap;
            muatDaftarKelas();
        };

        function logout() {
            localStorage.removeItem('lms_user');
            window.location.href = 'index.html';
        }

        async function muatDaftarKelas() {
            const container = document.getElementById('daftarKelasContainer');
            
            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'get_teacher_classes',
                        teacher_id: currentUser.user_id
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                
                if (result.status === 'success' && result.data.length > 0) {
                    container.innerHTML = ''; 
                    
                    result.data.forEach(kelas => {
                        const safeNamaKelas = kelas.nama_kelas.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        container.innerHTML += `
                            <div class="bg-white border border-slate-200 rounded-xl p-5 hover:border-sky-300 hover:shadow-md transition-all shadow-sm flex flex-col justify-between">
                                <div>
                                    <h3 class="text-lg font-bold text-slate-800 mb-2">${kelas.nama_kelas}</h3>
                                    <p class="text-xs font-medium text-slate-500 mb-4">Kode Kelas: 
                                        <span class="font-mono font-bold text-sky-700 bg-sky-50 border border-sky-200 px-2 py-1 rounded select-all">${kelas.kode_kelas}</span>
                                    </p>
                                </div>
                                <div class="flex flex-col gap-2">
                                    <a href="detail-kelas-guru.html?id=${kelas.class_id}&nama=${encodeURIComponent(kelas.nama_kelas)}" class="w-full text-center bg-sky-500 hover:bg-sky-600 text-sm font-semibold text-white py-2 rounded-lg transition-colors shadow-sm">
                                        Masuk ke Kelas
                                    </a>
                                    <div class="flex gap-2">
                                        <button onclick="bukaModalEditKelas('${kelas.class_id}', '${safeNamaKelas}')" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-600 text-sm font-semibold py-1.5 rounded-lg transition-colors border border-amber-200">
                                            Edit
                                        </button>
                                        <button onclick="hapusKelas('${kelas.class_id}', '${safeNamaKelas}')" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-semibold py-1.5 rounded-lg transition-colors border border-rose-200">
                                            Hapus
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `
                        <div class="bg-slate-50 border border-slate-300 border-dashed rounded-xl p-6 flex flex-col items-center justify-center text-slate-500 min-h-[150px] col-span-1 sm:col-span-2">
                            <span class="font-medium">Belum ada kelas yang dibuat</span>
                        </div>
                    `;
                }
            } catch (error) {
                container.innerHTML = `<div class="text-rose-500 col-span-2 text-center font-medium">Gagal memuat daftar kelas.</div>`;
            }
        }

        // --- FUNGSI MODAL EDIT KELAS ---
        function bukaModalEditKelas(classId, namaKelas) {
            document.getElementById('edit_class_id').value = classId;
            document.getElementById('edit_nama_kelas').value = namaKelas;
            document.getElementById('modalEditKelas').classList.remove('hidden');
        }

        async function simpanEditKelas(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSimpanEditKelas');
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'edit_class',
                        class_id: document.getElementById('edit_class_id').value,
                        nama_kelas: document.getElementById('edit_nama_kelas').value,
                        teacher_id: currentUser.user_id
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();
                if (result.status === 'success') {
                    document.getElementById('modalEditKelas').classList.add('hidden');
                    muatDaftarKelas(); // Refresh daftar kelas
                } else {
                    alert(`Gagal memperbarui kelas: ${result.message}`);
                }
            } catch (error) {
                alert("Terjadi kesalahan jaringan.");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Simpan';
            }
        }

        async function hapusKelas(classId, namaKelas) {
            if (!confirm(`Apakah Anda yakin ingin menghapus kelas "${namaKelas}"? Semua data materi dan tugas di dalam kelas ini akan ikut terhapus.`)) {
                return;
            }

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'delete_class',
                        class_id: classId,
                        teacher_id: currentUser.user_id
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();
                if (result.status === 'success') {
                    alert("Kelas berhasil dihapus.");
                    muatDaftarKelas(); 
                } else {
                    alert(`Gagal menghapus kelas: ${result.message}`);
                }
            } catch (error) {
                alert("Terjadi kesalahan jaringan saat menghapus kelas.");
            }
        }

        async function buatKelas(event) {
            event.preventDefault();
            const btnSubmit = document.getElementById('btnSubmit');
            const hasilDiv = document.getElementById('hasilBuatKelas');
            
            btnSubmit.disabled = true; btnSubmit.innerHTML = 'Memproses...';
            hasilDiv.classList.add('hidden');

            const payloadData = {
                action: 'create_class',
                nama_kelas: document.getElementById('nama_kelas').value,
                teacher_id: currentUser.user_id
            };

            try {
                const response = await fetch(scriptURL, {
                    method: 'POST', body: JSON.stringify(payloadData),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    hasilDiv.classList.remove('hidden');
                    document.getElementById('kodeKelasBaru').innerText = result.data.kode_kelas;
                    document.getElementById('formBuatKelas').reset();
                    muatDaftarKelas(); 
                } else {
                    alert(`Gagal membuat kelas: ${result.message}`);
                }
            } catch (error) {
                alert("Terjadi kesalahan jaringan.");
            } finally {
                btnSubmit.disabled = false; btnSubmit.innerHTML = 'Buat Kelas';
            }
        }
    </script>
</body>
</html>
