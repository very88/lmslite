<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Kelas - Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%); color: #f8fafc; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .neon-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body class="p-4 md:p-8">

    <nav class="glass-panel rounded-2xl p-4 mb-8 flex justify-between items-center max-w-5xl mx-auto">
        <div class="flex items-center gap-4">
            <a href="dashboard-siswa.html" class="text-slate-400 hover:text-white"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg></a>
            <div><div class="text-xs text-sky-400 font-bold uppercase">Ruang Kelas</div><div class="text-lg font-semibold text-white" id="namaKelasTitle">Memuat...</div></div>
        </div>
        <div class="text-sm text-slate-300">Mode Siswa</div>
    </nav>

    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Bagian Materi -->
        <div>
            <h2 class="text-xl font-bold mb-4 text-white">📖 Materi Pembelajaran</h2>
            <div id="daftarMateriContainer" class="space-y-4"><div class="glass-panel rounded-2xl p-6 text-center text-slate-400">Memuat materi...</div></div>
        </div>
        <!-- Bagian Tugas -->
        <div>
            <h2 class="text-xl font-bold mb-4 text-white">📝 Daftar Tugas</h2>
            <div id="daftarTugasContainer" class="space-y-4"><div class="glass-panel rounded-2xl p-6 text-center text-slate-400">Memuat tugas...</div></div>
        </div>
    </div>

    <script>
        // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyTICgF-NqTCpCw3A38R_wgxJ9AZZiXB9Y1yYaGG81LtyaRRUG95qBimEZ_5snTYoxj/exec';
        let currentUser = null;
        const urlParams = new URLSearchParams(window.location.search);
        const classId = urlParams.get('id');

        window.onload = function() {
            if (!localStorage.getItem('lms_user') || JSON.parse(localStorage.getItem('lms_user')).role !== 'Siswa') return window.location.href = 'index.html';
            currentUser = JSON.parse(localStorage.getItem('lms_user'));
            document.getElementById('namaKelasTitle').innerText = urlParams.get('nama') || "Detail Kelas";
            muatDaftarMateri(); 
            muatTugasSiswa();
        };

        // --- MUAT MATERI DENGAN EMBED OTOMATIS (YOUTUBE / DRIVE / PDF) ---
        async function muatDaftarMateri() {
            const container = document.getElementById('daftarMateriContainer');
            try {
                const res = await fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: 'get_class_materials', class_id: classId }) });
                const result = await res.json();
                if (result.status === 'success' && result.data.length > 0) {
                    container.innerHTML = '';
                    result.data.forEach(materi => {
                        const tgl = new Date(materi.created_at).toLocaleDateString('id-ID', { dateStyle: 'long' });
                        let embedHTML = '';

                        if (materi.file_url) {
                            let url = materi.file_url;
                            
                            // 1. Deteksi Tautan YouTube (Dilengkapi atribut izin agar tidak terjadi error konfigurasi)
                            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                                let videoId = '';
                                if (url.includes('youtu.be/')) {
                                    videoId = url.split('youtu.be/')[1].split('?')[0];
                                } else if (url.includes('watch?v=')) {
                                    videoId = url.split('watch?v=')[1].split('&')[0];
                                }
                                if (videoId) {
                                    embedHTML = `
                                        <div class="mt-4 relative w-full overflow-hidden rounded-xl shadow-lg" style="padding-top: 56.25%;">
                                            <iframe class="absolute top-0 left-0 w-full h-full border-0 rounded-xl" 
                                                src="https://www.youtube.com/embed/${videoId}" 
                                                title="YouTube video player" 
                                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                                allowfullscreen>
                                            </iframe>
                                        </div>
                                    `;
                                }
                            } 
                            // 2. Deteksi Google Drive / Dokumen / PDF
                            else if (url.includes('drive.google.com')) {
                                let embedUrl = url;
                                if (url.includes('/view')) {
                                    embedUrl = url.replace('/view', '/preview');
                                }
                                embedHTML = `
                                    <div class="mt-4 w-full h-64 md:h-96 rounded-xl overflow-hidden border border-slate-700 bg-slate-900 shadow-inner">
                                        <iframe src="${embedUrl}" class="w-full h-full border-0"></iframe>
                                    </div>
                                    <div class="mt-2 text-right">
                                        <a href="${url}" target="_blank" class="text-xs text-sky-400 hover:underline inline-flex items-center gap-1">Buka di Tab Baru ↗</a>
                                    </div>
                                `;
                            } 
                            // 3. Tautan Web Umum Lainnya
                            else {
                                embedHTML = `
                                    <div class="mt-4 w-full h-64 md:h-80 rounded-xl overflow-hidden border border-slate-700 bg-slate-900 shadow-inner">
                                        <iframe src="${url}" class="w-full h-full border-0"></iframe>
                                    </div>
                                    <div class="mt-2 text-right">
                                        <a href="${url}" target="_blank" class="text-xs text-sky-400 hover:underline inline-flex items-center gap-1">Buka Tautan Penuh ↗</a>
                                    </div>
                                `;
                            }
                        }

                        container.innerHTML += `
                            <div class="glass-panel rounded-2xl p-5 border border-emerald-500/30 mb-4">
                                <h3 class="text-lg font-semibold text-white mb-1">${materi.judul_materi}</h3>
                                <p class="text-xs text-slate-400 mb-2">Diposting: ${tgl}</p>
                                <p class="text-sm text-slate-300 mb-2">${materi.deskripsi || ''}</p>
                                ${embedHTML}
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-slate-500 border border-slate-700 border-dashed">Belum ada materi.</div>`;
                }
            } catch (e) { 
                container.innerHTML = `<div class="text-red-400 text-center">Gagal memuat materi.</div>`; 
            }
        }

        // --- MUAT TUGAS & TIMER COUNTDOWN ---
        async function muatTugasSiswa() {
            const container = document.getElementById('daftarTugasContainer');
            try {
                const res = await fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: 'get_student_assignments', class_id: classId, student_id: currentUser.user_id }) });
                const result = await res.json();
                if (result.status === 'success' && result.data.length > 0) {
                    container.innerHTML = '';
                    result.data.forEach(tugas => {
                        const deadlineDate = new Date(tugas.tenggat_waktu);
                        const now = new Date();
                        const isExpired = now > deadlineDate;
                        const isSubmitted = tugas.status === "Sudah Mengumpulkan";
                        
                        const tglFormat = deadlineDate.toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'short' });
                        const bgStatus = isSubmitted ? "bg-emerald-900/20 border-emerald-500/50" : (isExpired ? "bg-rose-950/20 border-rose-500/40" : "bg-slate-800/40 border-slate-700");
                        
                        let lampiranTugasGuru = tugas.file_url ? `<a href="${tugas.file_url}" target="_blank" class="block mt-2 text-xs text-sky-400 hover:underline">Lihat Lampiran Tugas</a>` : '';
                        
                        let submissionHTML = isSubmitted ? `<div class="mt-3 pt-3 border-t border-slate-700/50"><div class="text-sm text-slate-300 mb-2">Terkirim: <a href="${tugas.submitted_url}" target="_blank" class="text-sky-400 hover:underline break-all">Lihat File / Tautan</a></div><div class="flex items-center justify-between"><span class="bg-slate-900 px-3 py-1 rounded border border-slate-700 text-sm font-bold text-white">Nilai: ${tugas.nilai}</span>${!isExpired ? `<button onclick="document.getElementById('form_${tugas.assignment_id}').classList.toggle('hidden')" class="text-xs text-sky-400 hover:underline cursor-pointer">Perbaiki Tugas</button>` : '<span class="text-xs text-slate-500">Tenggat lewat (Tidak bisa ubah)</span>'}</div></div>` : "";
                        
                        let formHTML = "";
                        if (isExpired && !isSubmitted) {
                            formHTML = `<div class="mt-4 pt-4 border-t border-rose-500/20 text-center"><span class="text-xs text-rose-400 font-semibold">❌ Waktu pengumpulan telah berakhir. Anda tidak dapat mengumpulkan tugas ini.</span></div>`;
                        } else {
                            formHTML = `
                                <form id="form_${tugas.assignment_id}" class="mt-4 pt-4 border-t border-slate-700/50 ${isSubmitted ? 'hidden' : ''}" onsubmit="kirimTugas(event, '${tugas.assignment_id}', '${tugas.tenggat_waktu}')">
                                    <label class="block text-xs font-medium text-slate-300 mb-1">Metode Pengumpulan</label>
                                    <select id="metode_${tugas.assignment_id}" onchange="toggleMetode('${tugas.assignment_id}')" class="w-full bg-slate-900 border border-slate-700 rounded text-sm px-3 py-2 text-white neon-input mb-3">
                                        <option value="link">Tautan (Link Drive / YouTube / Web)</option>
                                        <option value="file">Upload File (PDF / Gambar / Doc)</option>
                                    </select>
                                    
                                    <div id="div_link_${tugas.assignment_id}">
                                        <input type="url" id="url_${tugas.assignment_id}" class="w-full bg-slate-900 border border-slate-700 rounded text-sm px-3 py-2 text-white neon-input mb-4" placeholder="Masukkan Tautan (https://...)">
                                    </div>
                                    
                                    <div id="div_file_${tugas.assignment_id}" class="hidden">
                                        <input type="file" id="file_${tugas.assignment_id}" class="w-full bg-slate-900 border border-slate-700 rounded text-sm px-3 py-1.5 text-white neon-input mb-1" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                                        <div class="text-[11px] text-amber-400 mb-4">* Maksimal ukuran file dibatasi 200 KB.</div>
                                    </div>
                                    
                                    <button type="submit" id="btn_${tugas.assignment_id}" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-semibold py-2 rounded text-sm transition-colors shadow-[0_0_10px_rgba(56,189,248,0.3)] cursor-pointer">Kumpulkan Tugas</button>
                                </form>
                            `;
                        }

                        let badgeStatusText = isSubmitted ? 'Sudah Mengumpulkan' : (isExpired ? 'Waktu Habis' : 'Belum Mengumpulkan');
                        let badgeColor = isSubmitted ? 'text-emerald-400 bg-emerald-950/40 border-emerald-500/30' : (isExpired ? 'text-rose-400 bg-rose-950/40 border-rose-500/30' : 'text-amber-400 bg-amber-950/40 border-amber-500/30');

                        container.innerHTML += `
                            <div class="glass-panel rounded-2xl p-5 border ${bgStatus} mb-4">
                                <div class="flex justify-between items-start gap-2 mb-2">
                                    <h3 class="font-semibold text-white">${tugas.judul_tugas}</h3>
                                    <span class="text-xs px-2.5 py-1 rounded border ${badgeColor} whitespace-nowrap">${badgeStatusText}</span>
                                </div>
                                <p class="text-xs text-slate-400 mb-1">Tenggat: ${tglFormat}</p>
                                <p class="text-xs font-mono font-medium text-sky-300 mb-3" id="timer_${tugas.assignment_id}" data-deadline="${tugas.tenggat_waktu}">Menghitung sisa waktu...</p>
                                ${lampiranTugasGuru}${submissionHTML}${formHTML}
                            </div>`;
                    });

                    mulaiTimerTugas();
                } else {
                    container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-slate-500 border border-slate-700 border-dashed">Belum ada tugas.</div>`;
                }
            } catch (e) { 
                container.innerHTML = `<div class="text-red-400 text-center">Gagal memuat tugas.</div>`; 
            }
        }

        // --- LIVE COUNTDOWN TIMER ---
        function mulaiTimerTugas() {
            setInterval(() => {
                const timerElements = document.querySelectorAll('[id^="timer_"]');
                timerElements.forEach(el => {
                    const deadlineStr = el.getAttribute('data-deadline');
                    const deadline = new Date(deadlineStr).getTime();
                    const now = new Date().getTime();
                    const distance = deadline - now;

                    if (distance < 0) {
                        el.innerHTML = "🔴 Waktu pengumpulan telah berakhir";
                        el.className = "text-xs font-mono font-medium text-rose-400 mb-3";
                    } else {
                        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                        let timeString = "⏳ Sisa waktu: ";
                        if (days > 0) timeString += `${days} hari `;
                        timeString += `${hours}j ${minutes}m ${seconds}d`;
                        el.innerHTML = timeString;
                    }
                });
            }, 1000);
        }

        function toggleMetode(assignmentId) {
            const metode = document.getElementById(`metode_${assignmentId}`).value;
            if (metode === 'link') {
                document.getElementById(`div_link_${assignmentId}`).classList.remove('hidden');
                document.getElementById(`div_file_${assignmentId}`).classList.add('hidden');
                document.getElementById(`file_${assignmentId}`).value = ''; 
            } else {
                document.getElementById(`div_link_${assignmentId}`).classList.add('hidden');
                document.getElementById(`div_file_${assignmentId}`).classList.remove('hidden');
                document.getElementById(`url_${assignmentId}`).value = ''; 
            }
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function kirimTugas(e, assignmentId, tenggatWaktu) {
            e.preventDefault(); 
            
            if (new Date() > new Date(tenggatWaktu)) {
                return alert("Gagal: Tenggat waktu pengumpulan tugas ini sudah berakhir!");
            }

            const btn = document.getElementById(`btn_${assignmentId}`); 
            const metode = document.getElementById(`metode_${assignmentId}`).value;
            const inputUrl = document.getElementById(`url_${assignmentId}`).value;
            const inputFile = document.getElementById(`file_${assignmentId}`);
            
            let payloadData = {
                action: 'submit_assignment',
                assignment_id: assignmentId,
                student_id: currentUser.user_id
            };

            if (metode === 'link') {
                if (!inputUrl) return alert("Anda belum memasukkan Tautan tugas!");
                payloadData.file_url = inputUrl;
            } else {
                if (inputFile.files.length === 0) return alert("Anda belum memilih file untuk diunggah!");
                const file = inputFile.files[0];
                
                if (file.size > 204800) {
                    return alert(`Ukuran file Anda ${(file.size / 1024).toFixed(1)} KB. Melebihi batas maksimal 200 KB! Silakan kompres file Anda.`);
                }

                payloadData.file_data = await getBase64(file);
                payloadData.file_name = `Tugas_${currentUser.nama_lengkap}_${file.name}`;
                payloadData.mime_type = file.type;
            }

            btn.disabled = true; 
            btn.innerHTML = 'Mengirim...';

            try {
                const res = await fetch(scriptURL, { 
                    method: 'POST', 
                    body: JSON.stringify(payloadData),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await res.json();
                
                if (result.status === 'success') {
                    alert("Tugas berhasil dikumpulkan!");
                    muatTugasSiswa(); 
                } else {
                    alert(`Gagal: ${result.message}`);
                }
            } catch (err) {
                alert(err.message || "Terjadi kesalahan jaringan.");
            } finally { 
                btn.disabled = false; 
                btn.innerHTML = 'Kumpulkan Tugas'; 
            }
        }
    </script>
</body>
</html>
