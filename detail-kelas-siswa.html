<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Kelas - Siswa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 100%); 
            color: #334155; 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .modern-input {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            transition: all 0.2s ease-in-out;
        }
        .modern-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Navbar -->
    <nav class="glass-panel rounded-2xl p-4 mb-8 flex justify-between items-center flex-wrap gap-4">
        <div class="flex items-center gap-4">
            <a href="dashboard-siswa.html" class="text-slate-400 hover:text-slate-700 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <div class="text-xl font-bold text-sky-600" id="namaKelasTitle">Memuat Kelas...</div>
        </div>
        <div class="flex items-center gap-3">
            <button id="btnAbsen" onclick="absenSekarang()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-lg transition-colors shadow-sm cursor-pointer flex items-center gap-1.5">
                <span>📍</span> Presensi Kehadiran
            </button>
            <div class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full border border-slate-200 hidden sm:block">Mode Siswa</div>
        </div>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Kolom Materi -->
        <div class="glass-panel rounded-2xl p-6">
            <div class="flex justify-between items-center mb-4 border-b border-slate-200 pb-2">
                <h2 class="text-xl font-bold text-slate-800">📖 Materi Pembelajaran</h2>
                <span class="text-xs bg-sky-100 text-sky-700 font-semibold px-2.5 py-1 rounded-full" id="badgeJumlahMateri">0 Materi</span>
            </div>
            <div id="materiContainer" class="space-y-4">
                <div class="text-slate-500 text-center py-6">Memuat materi...</div>
            </div>
        </div>

        <!-- Kolom Tugas -->
        <div class="glass-panel rounded-2xl p-6">
            <div class="flex justify-between items-center mb-4 border-b border-slate-200 pb-2">
                <h2 class="text-xl font-bold text-slate-800">📝 Daftar Tugas Kelas</h2>
                <span class="text-xs bg-amber-100 text-amber-700 font-semibold px-2.5 py-1 rounded-full" id="badgeJumlahTugas">0 Tugas</span>
            </div>
            <div id="tugasContainer" class="space-y-4">
                <div class="text-slate-500 text-center py-6">Memuat tugas...</div>
            </div>
        </div>
    </div>

    <!-- Modal Tanya Guru -->
    <div id="modalTanyaGuru" class="fixed inset-0 z-50 hidden bg-slate-800/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md border border-slate-200 shadow-xl">
            <h2 class="text-xl font-bold mb-2 text-slate-800 border-b border-slate-100 pb-2">💬 Tanya Guru / Diskusi Materi</h2>
            <p class="text-xs text-slate-500 mb-4" id="namaMateriDiskusi">Materi: -</p>
            
            <form onsubmit="kirimPertanyaanSiswa(event)">
                <input type="hidden" id="modal_material_id">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Pertanyaan / Kendala Anda</label>
                    <textarea id="pesan_pertanyaan" rows="3" required class="w-full rounded-lg p-3 modern-input text-xs" placeholder="Tuliskan hal yang belum Anda pahami..."></textarea>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="document.getElementById('modalTanyaGuru').classList.add('hidden')" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2 rounded-lg cursor-pointer transition-colors text-xs">Batal</button>
                    <button type="submit" id="btnKirimTanya" class="w-1/2 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold py-2 rounded-lg cursor-pointer shadow-md transition-colors text-xs">Kirim Pertanyaan</button>
                </div>
            </form>

            <div class="mt-5 border-t border-slate-100 pt-3">
                <h4 class="text-xs font-bold text-slate-700 mb-2">Riwayat Pertanyaan Anda:</h4>
                <div id="riwayatDiskusiContainer" class="max-h-40 overflow-y-auto space-y-2 custom-scroll pr-1 text-xs">
                    <span class="text-slate-400 italic">Belum ada diskusi.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pengumpulan Tugas -->
    <div id="modalKumpulTugas" class="fixed inset-0 z-50 hidden bg-slate-800/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-lg border border-slate-200 shadow-xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                <h2 class="text-xl font-bold text-slate-800" id="judulModalKumpul">Pengumpulan Tugas</h2>
                <button onclick="tutupModalKumpulTugas()" class="text-slate-400 hover:text-slate-700 text-2xl cursor-pointer leading-none">&times;</button>
            </div>
            
            <form id="formKumpulTugas" onsubmit="prosesKumpulTugas(event)" class="space-y-4 overflow-y-auto custom-scroll pr-1 flex-1">
                <input type="hidden" id="modal_assignment_id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">✍️ Jawaban Esai / Catatan</label>
                    <textarea id="submitted_text" rows="4" class="w-full rounded-lg p-3 modern-input text-xs" placeholder="Ketik jawaban esai atau penjelasan Anda di sini..."></textarea>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">📁 Upload File Jawaban (PDF/Doc/Zip/Gambar)</label>
                        <input type="file" id="file_jawaban" class="w-full rounded-lg px-3 py-1.5 modern-input text-xs file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 cursor-pointer">
                    </div>

                    <div class="relative flex py-1 items-center">
                        <div class="flex-grow border-t border-slate-200"></div>
                        <span class="flex-shrink mx-3 text-[10px] font-bold text-slate-400 uppercase">Atau Tautan</span>
                        <div class="flex-grow border-t border-slate-200"></div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">🔗 Link Tugas (Google Drive / Canva / YouTube)</label>
                        <input type="url" id="submitted_url" class="w-full rounded-lg px-4 py-2 modern-input text-xs" placeholder="https://...">
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="tutupModalKumpulTugas()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2 rounded-lg cursor-pointer transition-colors text-xs">Batal</button>
                    <button type="submit" id="btnSubmitTugas" class="w-1/2 bg-sky-500 hover:bg-sky-600 text-white font-semibold py-2 rounded-lg cursor-pointer shadow-md transition-colors text-xs">Kirim Jawaban</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyTICgF-NqTCpCw3A38R_wgxJ9AZZiXB9Y1yYaGG81LtyaRRUG95qBimEZ_5snTYoxj/exec';
        let currentUser = null;
        let globalMaterials = [];
        let globalAssignments = [];
        let globalReads = [];
        let globalQuestions = [];
        let globalAttendance = [];
        
        let startTimePengerjaan = null;

        const urlParams = new URLSearchParams(window.location.search);
        const classId = urlParams.get('id');
        const namaKelas = urlParams.get('nama') || "Detail Kelas";

        window.onload = function() {
            try {
                const userSession = localStorage.getItem('lms_user');
                if (!userSession) { window.location.href = 'index.html'; return; }
                currentUser = JSON.parse(userSession);
                if (!currentUser || currentUser.role !== 'Siswa') { window.location.href = 'index.html'; return; }
            } catch (err) { window.location.href = 'index.html'; return; }

            document.getElementById('namaKelasTitle').innerText = namaKelas;
            muatDataSiswaKelas();
        };

        async function muatDataSiswaKelas() {
            try {
                const res = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_student_room_data', class_id: classId, student_id: currentUser.user_id })
                });
                const result = await res.json();

                if (result.status === 'success') {
                    globalMaterials = result.materials || [];
                    globalAssignments = result.assignments || [];
                    globalReads = result.reads || [];
                    globalQuestions = result.questions || [];
                    globalAttendance = result.attendance || [];

                    renderMateriSiswa();
                    renderTugasSiswa();
                    cekStatusAbsenHariIni();
                }
            } catch (e) {
                document.getElementById('materiContainer').innerHTML = `<div class="text-rose-500 text-center py-4 text-xs font-semibold">Gagal memuat materi.</div>`;
                document.getElementById('tugasContainer').innerHTML = `<div class="text-rose-500 text-center py-4 text-xs font-semibold">Gagal memuat tugas.</div>`;
            }
        }

        function cekStatusAbsenHariIni() {
            const todayStr = new Date().toISOString().split('T')[0];
            const btnAbsen = document.getElementById('btnAbsen');
            const sudahAbsen = globalAttendance.some(a => a.student_id === currentUser.user_id && a.tanggal && a.tanggal.includes(todayStr));

            if (sudahAbsen) {
                btnAbsen.disabled = true;
                btnAbsen.className = "bg-slate-200 text-slate-500 font-bold text-xs px-4 py-2 rounded-lg cursor-not-allowed border border-slate-300";
                btnAbsen.innerHTML = "✓ Sudah Presensi Hari Ini";
            }
        }

        async function absenSekarang() {
            const btn = document.getElementById('btnAbsen');
            btn.disabled = true;
            btn.innerText = "Mencatat Presensi...";

            try {
                const res = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'submit_attendance', class_id: classId, student_id: currentUser.user_id, student_name: currentUser.nama_lengkap })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert(result.message);
                    muatDataSiswaKelas();
                } else {
                    alert(`Gagal: ${result.message}`);
                    btn.disabled = false;
                }
            } catch (e) {
                alert("Terjadi kesalahan jaringan.");
                btn.disabled = false;
            }
        }

        function renderMateriSiswa() {
            const container = document.getElementById('materiContainer');
            const visibleMaterials = globalMaterials.filter(m => m.status_materi !== 'sembunyi');
            document.getElementById('badgeJumlahMateri').innerText = `${visibleMaterials.length} Materi`;

            if (visibleMaterials.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-500 border border-dashed border-slate-300 rounded-xl bg-slate-50 text-xs">Belum ada materi pembelajaran yang diposting.</div>`;
                return;
            }

            container.innerHTML = '';
            visibleMaterials.forEach(materi => {
                let tgl = "-";
                if (materi.created_at) {
                    let d = new Date(materi.created_at);
                    if (!isNaN(d.getTime())) {
                        tgl = d.toLocaleDateString('id-ID', { dateStyle: 'medium' });
                    }
                }
                
                const sudahBaca = globalReads.some(r => r.material_id === materi.material_id && r.student_id === currentUser.user_id);
                const badgeBaca = sudahBaca 
                    ? `<span class="bg-emerald-100 text-emerald-700 font-bold text-[10px] px-2 py-0.5 rounded-full border border-emerald-300">✓ Selesai Dibaca</span>` 
                    : `<span class="bg-amber-100 text-amber-700 font-bold text-[10px] px-2 py-0.5 rounded-full border border-amber-300">⏳ Belum Dibaca</span>`;

                let linkHTML = '';
                if (materi.file_url) {
                    const isHtmlFile = materi.file_url.toLowerCase().includes('.html') || materi.file_url.toLowerCase().includes('.htm');
                    const previewBtn = isHtmlFile 
                        ? `<a href="${materi.file_url}" target="_blank" onclick="tandaiMateriDibaca('${materi.material_id}')" class="inline-flex items-center gap-1 text-xs font-bold text-indigo-600 hover:text-indigo-700 bg-indigo-50 border border-indigo-200 px-3 py-1.5 rounded-lg transition-colors">👁️ Preview Interactive HTML</a>`
                        : '';

                    linkHTML = `
                        <div class="flex items-center gap-2 flex-wrap mt-2">
                            <a href="${materi.file_url}" target="_blank" onclick="tandaiMateriDibaca('${materi.material_id}')" class="inline-flex items-center gap-1 text-xs font-semibold text-sky-600 hover:underline">🔗 Buka Lampiran Materi</a>
                            ${previewBtn}
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 shadow-sm p-4 rounded-xl space-y-3 hover:border-sky-300 transition-colors">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <h3 class="text-base font-bold text-slate-800">${materi.judul_materi}</h3>
                                <p class="text-[11px] text-slate-400">Diposting: ${tgl}</p>
                            </div>
                            <div>${badgeBaca}</div>
                        </div>
                        <p class="text-xs text-slate-600 whitespace-pre-line">${materi.deskripsi || ''}</p>
                        ${linkHTML}
                        <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                            <button onclick="tandaiMateriDibaca('${materi.material_id}')" class="text-xs text-emerald-600 hover:text-emerald-700 font-semibold cursor-pointer">Mark as Read ✓</button>
                            <button onclick="bukaModalTanyaGuru('${materi.material_id}', '${materi.judul_materi.replace(/'/g, "\\'")}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 px-3 py-1 rounded-lg font-semibold cursor-pointer transition-colors">💬 Tanya Guru</button>
                        </div>
                    </div>
                `;
            });
        }

        async function tandaiMateriDibaca(materialId) {
            try {
                await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'mark_material_read', material_id: materialId, student_id: currentUser.user_id })
                });
                muatDataSiswaKelas();
            } catch (e) {}
        }

        function renderTugasSiswa() {
            const container = document.getElementById('tugasContainer');
            document.getElementById('badgeJumlahTugas').innerText = `${globalAssignments.length} Tugas`;

            if (globalAssignments.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-500 border border-dashed border-slate-300 rounded-xl bg-slate-50 text-xs">Belum ada tugas kelas.</div>`;
                return;
            }

            container.innerHTML = '';
            globalAssignments.forEach(tugas => {
                let tglFormat = "-";
                if (tugas.tenggat_waktu) {
                    let d = new Date(tugas.tenggat_waktu);
                    if (!isNaN(d.getTime())) {
                        tglFormat = d.toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'short' });
                    }
                }
                
                let isSubmitted = tugas.status === 'Sudah Mengumpulkan';
                let badgeStatus = isSubmitted 
                    ? `<span class="bg-emerald-100 text-emerald-700 font-bold text-[10px] px-2.5 py-0.5 rounded-full border border-emerald-300">✓ ${tugas.status}</span>`
                    : `<span class="bg-rose-100 text-rose-700 font-bold text-[10px] px-2.5 py-0.5 rounded-full border border-rose-300">⏳ Belum Dikumpulkan</span>`;

                // TAMPILAN BERKAS / LAMPIRAN SOAL DARI GURU
                let linkAttachment = '';
                if (tugas.file_url && tugas.file_url.trim() !== '' && tugas.file_url !== 'Jawaban Esai Langsung (LMS)') {
                    const fileUrl = tugas.file_url;
                    const isHtmlFile = fileUrl.toLowerCase().includes('.html') || fileUrl.toLowerCase().includes('.htm');
                    
                    const previewBtn = isHtmlFile 
                        ? `<a href="${fileUrl}" target="_blank" class="inline-flex items-center gap-1 text-[11px] font-bold text-indigo-600 hover:text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-1 rounded-md transition-colors">👁️ Preview HTML</a>`
                        : '';

                    linkAttachment = `
                        <div class="mt-2 p-2.5 bg-sky-50/80 rounded-xl border border-sky-200 flex items-center justify-between flex-wrap gap-2">
                            <div class="flex items-center gap-2">
                                <span class="text-sky-600 text-sm">📎</span>
                                <span class="text-xs font-semibold text-slate-700">Lampiran / Berkas Soal:</span>
                            </div>
                            <div class="flex items-center gap-2">
                                ${previewBtn}
                                <a href="${fileUrl}" target="_blank" class="text-xs font-bold text-white bg-sky-500 hover:bg-sky-600 px-3 py-1 rounded-md shadow-xs transition-colors inline-flex items-center gap-1">
                                    Buka Berkas ↗
                                </a>
                            </div>
                        </div>
                    `;
                }

                let prasyaratTerkunci = false;
                let prasyaratInfo = '';

                if (tugas.required_material_id && tugas.required_material_id.trim() !== '') {
                    let reqIds = tugas.required_material_id.split(',').map(s => s.trim());
                    let studentReads = globalReads.filter(r => r.student_id === currentUser.user_id).map(r => r.material_id);
                    let isAllRead = reqIds.every(id => studentReads.includes(id));

                    if (!isAllRead) {
                        prasyaratTerkunci = true;
                        let unreadTitles = reqIds.filter(id => !studentReads.includes(id)).map(id => {
                            let m = globalMaterials.find(mat => mat.material_id === id);
                            return m ? m.judul_materi : 'Materi Wajib';
                        });

                        prasyaratInfo = `
                            <div class="bg-amber-50 border border-amber-200 rounded-lg p-2.5 text-xs text-amber-800 space-y-1 mt-2">
                                <strong class="flex items-center gap-1 text-amber-900">🔒 Tugas Terkunci (Materi Prasyarat)</strong>
                                <p class="text-[11px]">Anda harus membaca materi berikut terlebih dahulu sebelum dapat mengerjakan tugas ini:</p>
                                <ul class="list-disc list-inside text-[11px] font-semibold text-amber-700">
                                    ${unreadTitles.map(t => `<li>${t}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }
                }

                let btnAksi = '';
                if (prasyaratTerkunci) {
                    btnAksi = `<button disabled class="w-full bg-slate-200 text-slate-400 font-bold py-2 rounded-lg text-xs cursor-not-allowed">🔒 Terkunci (Selesaikan Materi Prasyarat)</button>`;
                } else if (isSubmitted) {
                    btnAksi = `<button onclick="bukaModalKumpulTugas('${tugas.assignment_id}', '${tugas.judul_tugas.replace(/'/g, "\\'")}', '${tugas.submitted_text ? tugas.submitted_text.replace(/'/g, "\\'").replace(/\n/g, '\\n') : ''}', '${tugas.submitted_url || ''}')" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 rounded-lg text-xs transition-colors shadow-xs">Edit / Kirim Ulang Jawaban</button>`;
                } else {
                    btnAksi = `<button onclick="bukaModalKumpulTugas('${tugas.assignment_id}', '${tugas.judul_tugas.replace(/'/g, "\\'")}', '', '')" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 rounded-lg text-xs transition-colors shadow-md">Kerjakan & Kumpulkan Tugas</button>`;
                }

                let feedbackHTML = (tugas.nilai && tugas.nilai !== '-') ? `
                    <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-xs space-y-1 mt-2">
                        <div class="flex justify-between items-center">
                            <strong class="text-emerald-800">📊 Nilai Guru:</strong>
                            <span class="text-sm font-bold text-emerald-600">${tugas.nilai} / 100</span>
                        </div>
                        ${tugas.feedback ? `<p class="text-slate-600 text-[11px]"><strong>Catatan:</strong> ${tugas.feedback}</p>` : ''}
                    </div>
                ` : '';

                let instruksiText = tugas.deskripsi || tugas.instruksi || '';
                let instruksiHTML = instruksiText ? `
                    <p class="text-xs text-slate-600 mt-1 bg-slate-50 p-2.5 rounded-lg border border-slate-100 whitespace-pre-line"><strong>Instruksi:</strong> ${instruksiText}</p>
                ` : '';

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 shadow-sm p-4 rounded-xl space-y-3">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <h3 class="text-base font-bold text-slate-800">${tugas.judul_tugas}</h3>
                                ${instruksiHTML}
                                <p class="text-xs font-semibold text-rose-500 mt-1">Tenggat: ${tglFormat}</p>
                            </div>
                            <div>${badgeStatus}</div>
                        </div>
                        ${linkAttachment}
                        ${prasyaratInfo}
                        ${feedbackHTML}
                        <div class="pt-2">${btnAksi}</div>
                    </div>
                `;
            });
        }

        function bukaModalTanyaGuru(materialId, judulMateri) {
            document.getElementById('modal_material_id').value = materialId;
            document.getElementById('namaMateriDiskusi').innerText = `Materi: ${judulMateri}`;
            document.getElementById('pesan_pertanyaan').value = '';
            
            const containerRiwayat = document.getElementById('riwayatDiskusiContainer');
            const listMateriQ = globalQuestions.filter(q => q.material_id === materialId && q.student_id === currentUser.user_id);

            if (listMateriQ.length > 0) {
                containerRiwayat.innerHTML = '';
                listMateriQ.forEach(q => {
                    const jawabanGuruHTML = q.jawaban_guru ? `
                        <div class="mt-1 bg-emerald-50 border border-emerald-200 p-2 rounded text-emerald-800">
                            <strong>Guru:</strong> ${q.jawaban_guru}
                        </div>
                    ` : `<span class="text-[10px] text-amber-600 italic">Menunggu balasan guru...</span>`;

                    containerRiwayat.innerHTML += `
                        <div class="bg-slate-50 border border-slate-200 p-2 rounded-lg">
                            <p class="text-slate-700"><strong>Anda:</strong> ${q.pesan}</p>
                            ${jawabanGuruHTML}
                        </div>
                    `;
                });
            } else {
                containerRiwayat.innerHTML = '<span class="text-slate-400 italic">Belum ada diskusi untuk materi ini.</span>';
            }

            document.getElementById('modalTanyaGuru').classList.remove('hidden');
        }

        async function kirimPertanyaanSiswa(e) {
            e.preventDefault();
            const btn = document.getElementById('btnKirimTanya');
            btn.disabled = true; btn.innerText = "Mengirim...";

            const materialId = document.getElementById('modal_material_id').value;
            const pesan = document.getElementById('pesan_pertanyaan').value;

            try {
                const res = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'submit_student_question',
                        class_id: classId,
                        material_id: materialId,
                        student_id: currentUser.user_id,
                        student_name: currentUser.nama_lengkap,
                        pesan: pesan
                    })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert("Pertanyaan terkirim!");
                    document.getElementById('modalTanyaGuru').classList.add('hidden');
                    muatDataSiswaKelas();
                }
            } catch (err) { alert("Kesalahan jaringan."); } 
            finally { btn.disabled = false; btn.innerText = "Kirim Pertanyaan"; }
        }

        function bukaModalKumpulTugas(assignmentId, judulTugas, existingText, existingUrl) {
            document.getElementById('modal_assignment_id').value = assignmentId;
            document.getElementById('judulModalKumpul').innerText = `Kumpulkan: ${judulTugas}`;
            document.getElementById('submitted_text').value = existingText || '';
            document.getElementById('submitted_url').value = existingUrl || '';
            document.getElementById('file_jawaban').value = '';

            startTimePengerjaan = new Date();
            document.getElementById('modalKumpulTugas').classList.remove('hidden');
        }

        function tutupModalKumpulTugas() {
            document.getElementById('modalKumpulTugas').classList.add('hidden');
            startTimePengerjaan = null;
        }

        async function prosesKumpulTugas(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitTugas');
            btn.disabled = true; btn.innerText = "Mengirim...";

            const assignmentId = document.getElementById('modal_assignment_id').value;
            const submittedText = document.getElementById('submitted_text').value;
            const submittedUrl = document.getElementById('submitted_url').value;
            const fileInput = document.getElementById('file_jawaban');

            let durasiDetik = 0;
            if (startTimePengerjaan) {
                durasiDetik = Math.round((new Date() - startTimePengerjaan) / 1000);
            }

            let payloadData = {
                action: 'submit_assignment',
                assignment_id: assignmentId,
                student_id: currentUser.user_id,
                submitted_text: submittedText,
                file_url: submittedUrl,
                durasi_detik: durasiDetik
            };

            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    payloadData.file_data = await getBase64(file);
                    payloadData.file_name = file.name;
                    payloadData.mime_type = file.type;
                }

                const res = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(payloadData),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert(result.message);
                    tutupModalKumpulTugas();
                    muatDataSiswaKelas();
                } else {
                    alert(`Gagal: ${result.message}`);
                }
            } catch (err) { alert("Kesalahan jaringan."); } 
            finally { btn.disabled = false; btn.innerText = "Kirim Jawaban"; }
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => { 
                const reader = new FileReader(); 
                reader.readAsDataURL(file); 
                reader.onload = () => resolve(reader.result); 
                reader.onerror = error => reject(error); 
            });
        }
    </script>
</body>
