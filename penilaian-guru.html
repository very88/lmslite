<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penilaian Tugas - Guru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 100%); 
            color: #334155; 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
        }
        .modern-input {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            transition: all 0.2s ease-in-out;
        }
        .modern-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-8">

    <nav class="glass-panel rounded-2xl p-4 mb-8 flex justify-between items-center max-w-5xl mx-auto">
        <div class="flex items-center gap-4">
            <button onclick="window.history.back()" class="text-slate-400 hover:text-slate-700 transition-colors cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            </button>
            <div>
                <div class="text-xs text-sky-600 font-bold uppercase tracking-wider">Panel Penilaian & Umpan Balik</div>
                <div class="text-lg font-bold text-slate-800" id="judulTugasDisplay">Memuat Judul...</div>
            </div>
        </div>
        <div class="text-sm font-semibold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200 shadow-xs">Mode Guru</div>
    </nav>

    <div class="max-w-5xl mx-auto space-y-6">
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="glass-panel rounded-2xl p-4 flex items-center gap-4 border border-slate-200">
                <div class="bg-sky-100 p-3 rounded-xl text-sky-600 font-bold text-lg">📊</div>
                <div>
                    <div class="text-xl font-bold text-slate-800" id="statTotal">0</div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Total Pengumpulan</div>
                </div>
            </div>
            <div class="glass-panel rounded-2xl p-4 flex items-center gap-4 border border-slate-200">
                <div class="bg-emerald-100 p-3 rounded-xl text-emerald-600 font-bold text-lg">✅</div>
                <div>
                    <div class="text-xl font-bold text-slate-800" id="statSudahDinilai">0</div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Sudah Dinilai</div>
                </div>
            </div>
            <div class="glass-panel rounded-2xl p-4 flex items-center gap-4 border border-slate-200">
                <div class="bg-amber-100 p-3 rounded-xl text-amber-600 font-bold text-lg">⏳</div>
                <div>
                    <div class="text-xl font-bold text-slate-800" id="statBelumDinilai">0</div>
                    <div class="text-xs font-semibold text-slate-500 uppercase">Belum Dinilai</div>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl p-6">
            
            <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-6 pb-4 border-b border-slate-200">
                <div class="relative flex-1">
                    <input type="text" id="inputCariSiswa" oninput="handleSearch()" placeholder="Cari berdasarkan nama siswa..." class="w-full rounded-lg pl-10 pr-4 py-2 text-sm modern-input">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 absolute left-3 top-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <div class="flex rounded-lg bg-slate-200/70 p-1 border border-slate-300 text-xs font-semibold self-start sm:self-auto">
                    <button onclick="filterNilai('semua')" id="filtSemua" class="px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-xs transition-all cursor-pointer">Semua</button>
                    <button onclick="filterNilai('belum')" id="filtBelum" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all cursor-pointer">Belum Dinilai</button>
                    <button onclick="filterNilai('sudah')" id="filtSudah" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all cursor-pointer">Sudah Dinilai</button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 text-sm">
                            <th class="py-3 px-4 font-semibold">Nama Siswa</th>
                            <th class="py-3 px-4 font-semibold text-center">Tautan / Berkas / Esai</th>
                            <th class="py-3 px-4 font-semibold text-center w-28">Nilai (0-100)</th>
                            <th class="py-3 px-4 font-semibold">Umpan Balik / Catatan Guru</th>
                            <th class="py-3 px-4 font-semibold text-center w-24">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelPengumpulan">
                        <tr><td colspan="5" class="text-center py-8 text-slate-500 font-medium">Memuat data pengumpulan...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modalEsai" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl border border-slate-200 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <div>
                    <h3 class="text-lg font-bold text-slate-800" id="modalNamaSiswa">Jawaban Esai Siswa</h3>
                    <p class="text-xs text-sky-600 font-semibold" id="modalInfoTugas">Tugas Evaluasi</p>
                </div>
                <button onclick="tutupModalEsai()" class="text-slate-400 hover:text-slate-700 font-bold text-xl cursor-pointer">&times;</button>
            </div>
            
            <div id="modalFlagInfo" class="p-3 rounded-xl border text-xs"></div>

            <div id="modalIsiEsai" class="max-h-80 overflow-y-auto p-4 bg-slate-50 rounded-xl border border-slate-200 text-slate-700 text-sm whitespace-pre-line custom-scroll">
                Memuat teks esai...
            </div>
            <div class="text-right pt-2">
                <button onclick="tutupModalEsai()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2 rounded-xl text-sm transition-colors cursor-pointer">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyTICgF-NqTCpCw3A38R_wgxJ9AZZiXB9Y1yYaGG81LtyaRRUG95qBimEZ_5snTYoxj/exec';
        
        let globalSubmissions = [];
        let currentFilter = 'semua';
        let searchQuery = '';

        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id_tugas');
        const taskTitle = urlParams.get('judul_tugas');

        window.onload = function() {
            if (!taskId) { alert("ID Tugas tidak ditemukan!"); window.history.back(); return; }
            document.getElementById('judulTugasDisplay').innerText = taskTitle || "Detail Tugas";
            muatDaftarPengumpulan();
        };

        async function muatDaftarPengumpulan() {
            const tbody = document.getElementById('tabelPengumpulan');
            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_submissions', assignment_id: taskId }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                
                if (result.status === 'success' && result.data.length > 0) {
                    globalSubmissions = result.data;
                    updateStatsAndRender();
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500 font-medium border-b border-slate-200">Belum ada siswa yang mengumpulkan tugas ini.</td></tr>`;
                    updateStats(0, 0, 0);
                }
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-rose-500 font-medium">Gagal memuat data.</td></tr>`;
            }
        }

        function updateStats(total, sudah, belum) {
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statSudahDinilai').innerText = sudah;
            document.getElementById('statBelumDinilai').innerText = belum;
        }

        function filterNilai(status) {
            currentFilter = status;
            document.getElementById('filtSemua').className = status === 'semua' ? "px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-xs font-bold transition-all cursor-pointer" : "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all cursor-pointer";
            document.getElementById('filtBelum').className = status === 'belum' ? "px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-xs font-bold transition-all cursor-pointer" : "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all cursor-pointer";
            document.getElementById('filtSudah').className = status === 'sudah' ? "px-3 py-1.5 rounded-md bg-white text-slate-800 shadow-xs font-bold transition-all cursor-pointer" : "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all cursor-pointer";
            
            updateStatsAndRender();
        }

        function handleSearch() {
            searchQuery = document.getElementById('inputCariSiswa').value.toLowerCase();
            updateStatsAndRender();
        }

        function updateStatsAndRender() {
            let total = globalSubmissions.length;
            let sudah = globalSubmissions.filter(s => s.nilai !== undefined && s.nilai !== "" && s.nilai !== null).length;
            let belum = total - sudah;
            updateStats(total, sudah, belum);

            let filtered = globalSubmissions.filter(sub => {
                let matchSearch = sub.student_name.toLowerCase().includes(searchQuery);
                let hasGrade = sub.nilai !== undefined && sub.nilai !== "" && sub.nilai !== null;
                
                if (currentFilter === 'belum') return matchSearch && !hasGrade;
                if (currentFilter === 'sudah') return matchSearch && hasGrade;
                return matchSearch;
            });

            renderTabel(filtered);
        }

        function renderTabel(data) {
            const tbody = document.getElementById('tabelPengumpulan');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500 font-medium border-b border-slate-200">Tidak ada data siswa yang cocok dengan pencarian / filter.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(sub => {
                const feedbackVal = sub.feedback !== undefined && sub.feedback !== null ? sub.feedback : '';
                
                let fileColumnHTML = '';
                const isEssay = sub.submitted_text && sub.submitted_text.trim() !== '' && sub.file_url === 'Jawaban Esai Langsung (LMS)';

                if (isEssay) {
                    const safeText = encodeURIComponent(sub.submitted_text);
                    const durasi = sub.durasi_detik || 0;
                    const flagStatus = sub.flag_status || 'Normal';
                    
                    let badgeFlagHTML = '';
                    if (flagStatus === "Terdeteksi Instan") {
                        badgeFlagHTML = `<span class="bg-amber-100 text-amber-800 border border-amber-300 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 mt-1">⚠️ Terdeteksi Cepat (${durasi} dtk)</span>`;
                    } else {
                        badgeFlagHTML = `<span class="bg-emerald-100 text-emerald-800 border border-emerald-200 text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 mt-1">✅ Normal (${durasi} dtk)</span>`;
                    }

                    fileColumnHTML = `
                        <div class="flex flex-col items-center gap-1">
                            <button onclick="bukaModalEsai('${sub.student_name}', '${safeText}', '${flagStatus}', ${durasi})" class="bg-sky-50 hover:bg-sky-100 text-sky-700 font-semibold px-3 py-1.5 rounded-lg border border-sky-200 text-xs inline-flex items-center gap-1.5 transition-colors cursor-pointer shadow-2xs">
                                <span>📖</span> Baca Esai Teks
                            </button>
                            ${badgeFlagHTML}
                        </div>
                    `;
                } else {
                    fileColumnHTML = `
                        <a href="${sub.file_url || '#'}" target="_blank" class="text-sky-600 hover:text-sky-700 hover:underline flex items-center justify-center gap-1 font-semibold text-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                            Buka Berkas ↗
                        </a>
                    `;
                }

                tbody.innerHTML += `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 transition-colors">
                        <td class="py-4 px-4 font-bold text-slate-800">${sub.student_name}</td>
                        <td class="py-4 px-4 text-center">
                            ${fileColumnHTML}
                        </td>
                        <td class="py-4 px-4">
                            <input type="number" id="nilai_${sub.submission_id}" value="${sub.nilai !== undefined ? sub.nilai : ''}" min="0" max="100" class="w-full rounded px-2 py-1.5 text-center modern-input">
                        </td>
                        <td class="py-4 px-4">
                            <input type="text" id="feedback_${sub.submission_id}" value="${feedbackVal}" placeholder="Tulis catatan/umpan balik..." class="w-full rounded px-3 py-1.5 text-sm modern-input">
                        </td>
                        <td class="py-4 px-4 text-center">
                            <button onclick="simpanNilai('${sub.submission_id}')" id="btn_${sub.submission_id}" class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-sm px-3 py-1.5 rounded-lg shadow-sm transition-colors cursor-pointer">Simpan</button>
                        </td>
                    </tr>
                `;
            });
        }

        function bukaModalEsai(namaSiswa, encodedText, flagStatus, durasi) {
            const modal = document.getElementById('modalEsai');
            document.getElementById('modalNamaSiswa').innerText = `Jawaban Esai: ${namaSiswa}`;
            document.getElementById('modalInfoTugas').innerText = taskTitle || "Tugas Evaluasi";
            document.getElementById('modalIsiEsai').innerText = decodeURIComponent(encodedText);
            
            const flagInfoBox = document.getElementById('modalFlagInfo');
            if (flagStatus === "Terdeteksi Instan") {
                flagInfoBox.className = "p-3 rounded-xl border bg-amber-50 border-amber-200 text-amber-900";
                flagInfoBox.innerHTML = `⚠️ <strong>Peringatan Sistem:</strong> Siswa mengetik esai ini dalam waktu <strong>${durasi} detik</strong> (di bawah ambang batas 60 detik). Berpotensi hasil salin-tempel/AI luar. Mohon tinjau secara teliti.`;
            } else {
                flagInfoBox.className = "p-3 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-900";
                flagInfoBox.innerHTML = `✅ <strong>Validasi Sistem:</strong> Pola pengetikan mandiri normal dengan durasi pengerjaan <strong>${durasi} detik</strong>.`;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function tutupModalEsai() {
            const modal = document.getElementById('modalEsai');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        async function simpanNilai(submissionId) {
            const inputNilai = document.getElementById(`nilai_${submissionId}`).value;
            const inputFeedback = document.getElementById(`feedback_${submissionId}`).value;
            const btn = document.getElementById(`btn_${submissionId}`);
            
            if (inputNilai === "") { alert("Masukkan angka nilai terlebih dahulu."); return; }

            btn.disabled = true; btn.innerText = "...";
            
            try {
                const response = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'update_grade', 
                        submission_id: submissionId, 
                        nilai: inputNilai,
                        feedback: inputFeedback 
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    const item = globalSubmissions.find(s => s.submission_id == submissionId);
                    if (item) {
                        item.nilai = inputNilai;
                        item.feedback = inputFeedback;
                    }
                    updateStatsAndRender();

                    btn.classList.replace('bg-emerald-500', 'bg-sky-500');
                    btn.innerText = "Tersimpan";
                    setTimeout(() => { 
                        btn.classList.replace('bg-sky-500', 'bg-emerald-500'); 
                        btn.innerText = "Simpan"; 
                        btn.disabled = false; 
                    }, 2000);
                } else {
                    alert(`Gagal menyimpan: ${result.message}`); btn.disabled = false; btn.innerText = "Simpan";
                }
            } catch (error) {
                alert("Kesalahan jaringan."); btn.disabled = false; btn.innerText = "Simpan";
            }
        }
    </script>
</body>
</html>
