<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Monitoring Kelas - SMANJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 100%); 
            color: #334155; 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Navbar -->
    <nav class="glass-panel rounded-2xl p-4 mb-8 flex justify-between items-center flex-wrap gap-4">
        <div class="flex items-center gap-4">
            <a href="dashboard-monitoring.html" class="text-slate-400 hover:text-slate-700 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
            </a>
            <div>
                <span class="text-xs font-bold text-sky-600 uppercase tracking-wider">Mode Monitoring Publik</span>
                <div class="text-xl font-bold text-slate-800" id="namaKelasTitle">Memuat Kelas...</div>
            </div>
        </div>
        <a href="dashboard-monitoring.html" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold text-sm px-4 py-2 rounded-xl transition-colors">📊 Kembali ke Dashboard Utama</a>
    </nav>

    <!-- Konten Rekap Detail Kelas -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Daftar Materi -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-xl font-bold mb-4 text-slate-800 border-b border-slate-200 pb-2">📖 Rekap Materi Pembelajaran</h2>
            <div id="containerMateri" class="space-y-4">
                <div class="text-slate-400 text-center py-4">Memuat materi kelas...</div>
            </div>
        </div>

        <!-- Daftar Tugas -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-xl font-bold mb-4 text-slate-800 border-b border-slate-200 pb-2">📝 Rekap Tugas & Penugasan</h2>
            <div id="containerTugas" class="space-y-4">
                <div class="text-slate-400 text-center py-4">Memuat tugas kelas...</div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyTICgF-NqTCpCw3A38R_wgxJ9AZZiXB9Y1yYaGG81LtyaRRUG95qBimEZ_5snTYoxj/exec';
        const urlParams = new URLSearchParams(window.location.search);
        const classId = urlParams.get('id');
        const namaKelas = urlParams.get('nama') || "Detail Kelas";

        window.onload = function() {
            document.getElementById('namaKelasTitle').innerText = namaKelas;
            if (!classId) {
                alert("ID Kelas tidak valid!");
                window.location.href = 'dashboard-monitoring.html';
                return;
            }
            muatDetailMonitoringKelas();
        };

        async function muatDetailMonitoringKelas() {
            try {
                const res = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_teacher_room_data', class_id: classId })
                });
                const result = await res.json();

                if (result.status === 'success') {
                    renderMateri(result.materials || []);
                    renderTugas(result.assignments || [], result.submissions || []);
                } else {
                    throw new Error(result.message || "Gagal mengambil data.");
                }
            } catch (err) {
                console.error(err);
                document.getElementById('containerMateri').innerHTML = `<div class="text-rose-500 text-center py-4">Gagal memuat materi.</div>`;
                document.getElementById('containerTugas').innerHTML = `<div class="text-rose-500 text-center py-4">Gagal memuat tugas.</div>`;
            }
        }

        function renderMateri(materials) {
            const container = document.getElementById('containerMateri');
            if (materials.length === 0) {
                container.innerHTML = `<div class="text-center p-6 text-slate-400 border border-dashed border-slate-200 rounded-xl">Belum ada materi diposting di kelas ini.</div>`;
                return;
            }

            container.innerHTML = '';
            materials.forEach(m => {
                const tgl = new Date(m.created_at).toLocaleDateString('id-ID', { dateStyle: 'long' });
                const linkHTML = m.file_url ? `<a href="${m.file_url}" target="_blank" class="mt-2 inline-flex items-center gap-1.5 text-xs font-semibold text-sky-600 hover:underline">🔗 Buka Lampiran / Tautan</a>` : '';
                
                container.innerHTML += `
                    <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-2xs space-y-1">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-800">${m.judul_materi}</h3>
                            <span class="text-[10px] text-slate-400">${tgl}</span>
                        </div>
                        <p class="text-xs text-slate-600">${m.deskripsi || 'Tidak ada deskripsi.'}</p>
                        <div>${linkHTML}</div>
                    </div>
                `;
            });
        }

        function renderTugas(assignments, submissions) {
            const container = document.getElementById('containerTugas');
            if (assignments.length === 0) {
                container.innerHTML = `<div class="text-center p-6 text-slate-400 border border-dashed border-slate-200 rounded-xl">Belum ada tugas diposting di kelas ini.</div>`;
                return;
            }

            container.innerHTML = '';
            assignments.forEach(t => {
                const deadline = new Date(t.tenggat_waktu).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
                
                // Hitung jumlah siswa yang mengumpulkan tugas ini
                const totalKumpul = submissions.filter(s => s.assignment_id === t.assignment_id && (s.file_url || s.submitted_text)).length;

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-2xs space-y-2">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-800">${t.judul_tugas}</h3>
                            <span class="bg-indigo-50 text-indigo-700 font-bold px-2 py-0.5 rounded-full text-[11px]">${totalKumpul} Siswa Mengumpulkan</span>
                        </div>
                        <p class="text-xs font-medium text-rose-500">⏰ Tenggat: ${deadline}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
